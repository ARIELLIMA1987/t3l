<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Divulgação | T3L</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b1020;
      color: #e9eefc;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      padding-bottom: 40px;
    }
    .topbar {
      background: rgba(12, 16, 26, 0.9);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btnVoltar {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 6px 14px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 0.9rem;
    }
    .container {
      max-width: 1200px;
      margin: 24px auto;
      padding: 0 16px;
    }
    .page-header { margin-bottom: 20px; }
    .page-header h1 { font-size: 1.6rem; color: #fff; }
    .page-header p { color: #94a3b8; font-size: 0.9rem; margin-top: 4px; }

    .templateCard {
      background: #ffffff;
      color: #1e293b;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
    }
    .templateHeader {
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 12px;
      margin-bottom: 20px;
    }
    .templateHeader h2 { font-size: 1.2rem; color: #0f172a; }

    /* Layout 2 Colunas */
    .templateBody {
      display: flex;
      flex-direction: row;
      gap: 32px;
      align-items: flex-start;
    }
    @media (max-width: 900px) {
      .templateBody { flex-direction: column; }
    }

    .templateForm {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }
    .templateForm label {
      font-size: 0.85rem;
      font-weight: 700;
      color: #334155;
      margin-bottom: -4px;
    }
    .templateForm input, .templateForm select {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
      background: #fff;
      color: #1e293b;
    }

    /* Card Preview Travado */
    .previewContainer {
      width: 400px;
      height: 711px;
      position: relative;
      overflow: hidden;
      border-radius: 8px;
      background: #000;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      flex-shrink: 0;
    }
    .previewInner {
      position: absolute;
      top: 0;
      left: 0;
      width: 1080px;
      height: 1920px;
      transform: scale(0.37037);
      transform-origin: top left;
      background: #000;
    }
    .previewInner .previewBg {
      position: absolute;
      top: 0;
      left: 0;
      width: 1080px;
      height: 1920px;
      z-index: 1;
      display: block;
    }
    .previewInner [data-bind] {
      font-family: 'Impact', 'Arial Black', sans-serif;
      text-transform: uppercase;
      z-index: 5;
    }

    /* Posições */
    .previewColeta {
      position: absolute;
      top: 920px;
      left: 0;
      width: 1080px;
      text-align: center;
      z-index: 5;
    }
    .previewColeta .val {
      font-size: 54px;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 4px 4px 6px #000000;
      line-height: 1.1;
    }
    .previewColeta .sub {
      font-size: 36px;
      font-weight: bold;
      color: #111111;
      margin-top: 4px;
    }

    .previewDescarga {
      position: absolute;
      top: 1145px;
      left: 0;
      width: 1080px;
      text-align: center;
      z-index: 5;
    }
    .previewDescarga .val {
      font-size: 54px;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 4px 4px 6px #000000;
      line-height: 1.1;
    }
    .previewDescarga .sub {
      font-size: 36px;
      font-weight: bold;
      color: #111111;
      margin-top: 4px;
    }

    .previewProduct {
      position: absolute;
      top: 1315px;
      left: 0;
      width: 1080px;
      text-align: center;
      font-size: 52px;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 4px 4px 8px #000000;
    }

    .previewPrice {
      position: absolute;
      top: 1435px;
      left: 520px;
      width: 500px;
      text-align: left;
      font-size: 64px;
      font-weight: 900;
      color: #111111;
      line-height: 1;
    }

    .previewContacts {
      position: absolute;
      top: 1630px;
      left: 0;
      width: 1080px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      text-align: center;
      z-index: 5;
    }
    .previewContacts .line {
      font-size: 38px;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 3px 3px 6px #000000;
    }

    .previewNote {
      position: absolute;
      bottom: 45px;
      left: 0;
      width: 1080px;
      text-align: center;
      font-size: 36px;
      font-weight: 900;
      color: #f59e0b;
      text-shadow: 2px 2px 4px #000000;
    }

    .templateActions {
      display: flex;
      gap: 12px;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid #e2e8f0;
    }
    .btnAction {
      padding: 10px 22px;
      font-size: 0.95rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      border: none;
    }
    .btnAction.green { background: #10b981; color: #fff; }
    .btnAction.ghost { background: transparent; border: 1px solid #cbd5e1; color: #475569; }
  </style>
</head>
<body>

  <div class="topbar">
    <h3 style="color:#f59e0b;">T3L TRANSPORTES</h3>
    <a class="btnVoltar" href="./home.html">Voltar</a>
  </div>

  <main class="container">
    <div class="page-header">
      <h1>Divulgação</h1>
      <p>Preencha os campos e salve a imagem em JPG.</p>
    </div>

    <div class="templateCard" data-template="1">
      <div class="templateHeader">
        <h2>Modelo 1 - Coleta x Descarga</h2>
      </div>

      <div class="templateBody">
        <div class="templateForm">
          <label>Local de coleta (Cidade-UF)</label>
          <input data-template="1" data-field="coletaCidade" placeholder="Ex: RIO VERDE/GO" />

          <label>Local de coleta (Detalhe)</label>
          <input data-template="1" data-field="coletaLocal" placeholder="Ex: TERMINAL RUMO" />

          <label>Local de descarga (Cidade-UF)</label>
          <input data-template="1" data-field="descargaCidade" placeholder="Ex: INDIARA/GO" />

          <label>Local de descarga (Detalhe)</label>
          <input data-template="1" data-field="descargaLocal" placeholder="Ex: COMIGO" />

          <label>Produto</label>
          <input data-template="1" data-field="produto" placeholder="Ex: SOJA EM GRAOS" />

          <label>Valor por tonelada</label>
          <input data-template="1" data-field="valor" placeholder="Ex: R$ 80,00" />

          <label>Observações</label>
          <input data-template="1" data-field="obs" placeholder="Ex: PAGAMENTO NO PIX" />

          <label>Filial</label>
          <select data-template="1" data-field="filial">
            <option value="">Selecione...</option>
            <option value="RIOVERDE">RIO VERDE</option>
          </select>

          <label>Contatos (linha 1)</label>
          <input data-template="1" data-field="contato1" placeholder="Ex: (64) 9xxxx-xxxx" />

          <label>Contatos (linha 2)</label>
          <input data-template="1" data-field="contato2" placeholder="Ex: (64) 9xxxx-xxxx" />

          <label>Contatos (linha 3)</label>
          <input data-template="1" data-field="contato3" placeholder="Ex: (64) 9xxxx-xxxx" />

          <label>Contatos (linha 4)</label>
          <input data-template="1" data-field="contato4" placeholder="Ex: (64) 9xxxx-xxxx" />
        </div>

        <div class="previewContainer">
          <div class="previewInner" data-template-preview="1">
            <img class="previewBg" src="../assets/img/postt3l.png" alt="Template" />

            <div class="previewColeta">
              <div class="val" data-bind="coletaCidade">-CIDADE-UF</div>
              <div class="sub" data-bind="coletaLocal">Local</div>
            </div>

            <div class="previewDescarga">
              <div class="val" data-bind="descargaCidade">-CIDADE-UF</div>
              <div class="sub" data-bind="descargaLocal">Local</div>
            </div>

            <div class="previewProduct" data-bind="produto">PRODUTO</div>
            <div class="previewPrice" data-bind="valor">R$ 00,00</div>

            <div class="previewContacts">
              <div class="line" data-bind="contato1"></div>
              <div class="line" data-bind="contato2"></div>
              <div class="line" data-bind="contato3"></div>
              <div class="line" data-bind="contato4"></div>
            </div>

            <div class="previewNote" data-bind="obs">OBSERVAÇÃO</div>
          </div>
        </div>
      </div>

      <div class="templateActions">
        <button class="btnAction green" data-action="save" data-template="1">Salvar JPG</button>
        <button class="btnAction ghost" data-action="reset" data-template="1">Resetar</button>
      </div>
    </div>
  </main>

  <script src="../assets/js/auth.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="../assets/js/divulgacao.js"></script>
</body>
</html>
